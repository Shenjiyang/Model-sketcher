name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: vendor/elk/package-lock.json

      - name: Install ELK dependency
        run: npm ci --prefix vendor/elk

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
